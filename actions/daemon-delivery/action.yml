name: Native daemon human review handoff
description: Resolve fresh PR reviewer targets through pinned native gh-aw delivery.
inputs:
  validate-proposal:
    description: Validate native proposal identities and bound human reviewer targets before patching.
    required: false
    default: 'false'
outputs:
  trusted-directory:
    description: Trusted helper directory, also exported as DAEMON_DELIVERY_TRUSTED.
    value: ${{ steps.prepare.outputs.trusted-directory }}
runs:
  using: composite
  steps:
    - name: Preserve trusted helpers and prepare native reviewer delivery
      id: prepare
      shell: bash
      env:
        AUTOMATION_ROOT: ${{ github.action_path }}/../..
        DAEMON_DELIVERY_VALIDATE_PROPOSAL: ${{ inputs.validate-proposal }}
      # mktemp creates this path from runner-owned state; no repository/event input.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        trusted="$(mktemp -d "$RUNNER_TEMP/daemon-delivery-trusted.XXXXXX")"
        cp "$AUTOMATION_ROOT/daemon-delivery/"{prepare-reviewer-handler,reviewer-handler,human-reviewer,native-transport}.cjs "$trusted/"
        node "$trusted/prepare-reviewer-handler.cjs"
        printf 'DAEMON_DELIVERY_TRUSTED=%s\n' "$trusted" >> "$GITHUB_ENV"
        printf 'trusted-directory=%s\n' "$trusted" >> "$GITHUB_OUTPUT"
