name: Dependency delivery boundary
description: Bind pinned native dependency publishers to trusted eligibility and concurrency guards.
outputs:
  trusted-directory:
    description: Trusted helper directory, also exported as DEPENDENCY_MAINTENANCE_TRUSTED.
    value: ${{ steps.prepare.outputs.trusted-directory }}
runs:
  using: composite
  steps:
    - name: Preserve trusted controls and constrain native dependency delivery
      id: prepare
      shell: bash
      env:
        AUTOMATION_ROOT: ${{ github.action_path }}/../..
      # mktemp creates this path from runner-owned state; no repository/event input.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        trusted="$(mktemp -d "$RUNNER_TEMP/dependency-maintenance-trusted.XXXXXX")"
        cp "$AUTOMATION_ROOT/dependency-maintenance/"{delivery,prepare,human-reviewer}.cjs "$trusted/"
        node "$trusted/prepare.cjs"
        printf 'DEPENDENCY_MAINTENANCE_TRUSTED=%s\n' "$trusted" >> "$GITHUB_ENV"
        printf 'trusted-directory=%s\n' "$trusted" >> "$GITHUB_OUTPUT"
